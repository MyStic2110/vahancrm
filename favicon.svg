    <!-- Aerodynamic Car Body -->
    <path d="M14 36 C14 34.5 15.5 33 17 33 L22 33 L27 24 C28 22.5 29.5 22 31.5 22 L45 22 C47 22 48.5 23 49.5 24.5 L53.5 31 C55 31.8 56 33.2 56 35 L56 42 C56 43 55 44 54 44 L51 44 C50 44 49 43 49 42 C49 39.8 47.2 38 45 38 C42.8 38 41 39.8 41 42 C41 43 40 44 39 44 L25 44 C25 43 24 42 24 42 C24 39.8 22.2 38 20 38 C17.8 38 16 39.8 16 42 C16 43 15 44 14 44 L11 44 C10 44 9 43 9 42 L9 39 C9 37.3 11.5 36 14 36 Z"/>
    
    <!-- Wheels with Rims -->
    <circle cx="20" cy="42" r="5" fill="#1E293B"/>
    <circle cx="20" cy="42" r="2.2" fill="#FFFFFF"/>
    <circle cx="45" cy="42" r="5" fill="#1E293B"/>
    <circle cx="45" cy="42" r="2.2" fill="#FFFFFF"/>
    
