    <path d="M30 25 L43 25 C44.5 25 45.5 25.8 46.2 27 L48.8 32 L26.5 32 L28.8 26.5 C29.2 25.5 29.8 25 30 25 Z" fill="#DC2626" opacity="0.9"/>
    
